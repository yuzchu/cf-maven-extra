name: Fetch AGP+Kotlin Maven bundles
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Resolve & bundle AGP/Kotlin deps
        shell: bash
        run: |
          set -e
          mkdir -p work && cd work
          bundle() {
            local agp="$1" kt="$2" tag="$3"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "skip $tag (已存在)"; return
            fi
            echo "=== bundle $tag: AGP $agp + Kotlin $kt ==="
            rm -rf proj ~/.gradle/caches/modules-2
            mkdir -p proj
            printf '' > proj/settings.gradle
            printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies {\n    classpath "com.android.tools.build:gradle:%s"\n    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:%s"\n  }\n}\n' "$agp" "$kt" > proj/build.gradle
            ( cd proj && gradle help --no-daemon -q > /dev/null 2>&1 || gradle help -q > /dev/null 2>&1 || echo "resolve warn (继续, 已下载的依赖可用)" )
            tar czf "maven-${tag}.tar.gz" -C ~/.gradle/caches/modules-2 files-2.1 2>/dev/null || { echo "no cache produced"; return; }
            echo "bundle size: $(du -m maven-${tag}.tar.gz | cut -f1)MB"
            gh release create "$tag" "maven-${tag}.tar.gz" --repo "$GITHUB_REPOSITORY" --title "Maven bundle AGP ${agp} + Kotlin ${kt}" --notes "AGP ${agp} / Kotlin ${kt} full maven deps (files-2.1)"
          }
          bundle "8.2.0"  "1.9.20" "agp8.2-kt1.9.20"
          bundle "8.7.3"  "2.0.21" "agp8.7-kt2.0.21"
          bundle "8.5.2"  "1.9.24" "agp8.5-kt1.9.24"
          bundle "7.4.2"  "1.8.22" "agp7.4-kt1.8.22"
          bundle "8.0.2"  "1.8.22" "agp8.0-kt1.8.22"
        env:
          GH_TOKEN: ${{ github.token }}
